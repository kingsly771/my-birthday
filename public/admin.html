<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⚔️ VALENHART — ADMIN PANEL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <style>
    :root {
      --neon-blue: #00d4ff;
      --neon-violet: #9d00ff;
      --neon-pink: #ff006e;
      --neon-gold: #ffd700;
      --neon-green: #00ff88;
      --neon-red: #ff3355;
      --bg-deep: #03040a;
      --bg-panel: #07090f;
      --bg-card: #0d1220;
      --bg-card2: #111827;
      --border-neon: rgba(0, 212, 255, 0.3);
      --text-primary: #e8f4ff;
      --text-dim: rgba(200, 220, 255, 0.6);
      --font-main: 'Orbitron', monospace;
      --font-body: 'Rajdhani', sans-serif;
      --font-mono: 'Share Tech Mono', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg-deep);
      color: var(--text-primary);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-deep); }
    ::-webkit-scrollbar-thumb { background: var(--neon-violet); border-radius: 3px; }

    /* ── LOGIN OVERLAY ── */
    #login-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg-deep);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .login-box {
      background: var(--bg-card);
      border: 1px solid var(--border-neon);
      border-radius: 12px;
      padding: 2.5rem 2rem;
      width: min(400px, 90vw);
      text-align: center;
      box-shadow: 0 0 40px rgba(0, 212, 255, 0.15);
    }

    .login-logo {
      font-family: var(--font-main);
      font-size: 1.2rem;
      color: var(--neon-violet);
      text-shadow: 0 0 20px var(--neon-violet);
      margin-bottom: 0.4rem;
      letter-spacing: 0.1em;
    }

    .login-sub {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--neon-pink);
      margin-bottom: 2rem;
      letter-spacing: 0.15em;
    }

    .login-box input {
      width: 100%;
      background: var(--bg-deep);
      border: 1px solid var(--border-neon);
      border-radius: 6px;
      padding: 0.75rem 1rem;
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 1rem;
      outline: none;
      margin-bottom: 1rem;
      letter-spacing: 0.2em;
      text-align: center;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .login-box input:focus {
      border-color: var(--neon-blue);
      box-shadow: 0 0 12px rgba(0, 212, 255, 0.3);
    }

    .login-err {
      color: var(--neon-red);
      font-family: var(--font-mono);
      font-size: 0.8rem;
      margin-bottom: 0.8rem;
      min-height: 1.2em;
    }

    .neon-btn {
      background: transparent;
      border: 1px solid var(--neon-blue);
      color: var(--neon-blue);
      font-family: var(--font-main);
      font-size: 0.8rem;
      padding: 0.75rem 2rem;
      border-radius: 6px;
      cursor: pointer;
      letter-spacing: 0.12em;
      transition: all 0.2s;
      text-transform: uppercase;
      width: 100%;
    }

    .neon-btn:hover {
      background: var(--neon-blue);
      color: var(--bg-deep);
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
    }

    .neon-btn.danger {
      border-color: var(--neon-red);
      color: var(--neon-red);
      padding: 0.4rem 0.9rem;
      font-size: 0.65rem;
      width: auto;
    }

    .neon-btn.danger:hover {
      background: var(--neon-red);
      color: #fff;
      box-shadow: 0 0 16px rgba(255, 51, 85, 0.5);
    }

    /* ── MAIN ADMIN ── */
    #admin-panel { display: none; min-height: 100vh; }

    /* Header */
    .admin-header {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-neon);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 20px rgba(0, 0, 0, 0.5);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .admin-logo {
      font-family: var(--font-main);
      font-size: clamp(0.9rem, 2.5vw, 1.2rem);
      font-weight: 900;
      color: var(--neon-violet);
      text-shadow: 0 0 20px var(--neon-violet);
      letter-spacing: 0.1em;
    }

    .admin-badge {
      background: rgba(255, 0, 110, 0.15);
      border: 1px solid var(--neon-pink);
      color: var(--neon-pink);
      font-family: var(--font-mono);
      font-size: 0.65rem;
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      letter-spacing: 0.1em;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .last-refresh {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-dim);
    }

    .refresh-btn {
      background: transparent;
      border: 1px solid var(--neon-green);
      color: var(--neon-green);
      font-family: var(--font-mono);
      font-size: 0.7rem;
      padding: 0.4rem 0.8rem;
      border-radius: 5px;
      cursor: pointer;
      letter-spacing: 0.1em;
      transition: all 0.2s;
    }

    .refresh-btn:hover { background: rgba(0, 255, 136, 0.1); }

    .logout-btn {
      background: transparent;
      border: 1px solid rgba(255, 51, 85, 0.4);
      color: var(--neon-red);
      font-family: var(--font-mono);
      font-size: 0.7rem;
      padding: 0.4rem 0.8rem;
      border-radius: 5px;
      cursor: pointer;
      letter-spacing: 0.1em;
      transition: all 0.2s;
    }

    .logout-btn:hover { background: rgba(255, 51, 85, 0.1); }

    /* Content */
    .admin-content {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    /* Stats bar */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-chip {
      background: var(--bg-card);
      border: 1px solid var(--border-neon);
      border-radius: 10px;
      padding: 1.2rem 1rem;
      text-align: center;
      transition: border-color 0.2s;
    }

    .stat-chip:hover { border-color: var(--neon-blue); }

    .stat-chip .val {
      font-family: var(--font-main);
      font-size: 2rem;
      font-weight: 900;
      color: var(--neon-blue);
      text-shadow: 0 0 15px rgba(0, 212, 255, 0.6);
      display: block;
    }

    .stat-chip.pink .val { color: var(--neon-pink); text-shadow: 0 0 15px rgba(255, 0, 110, 0.6); }
    .stat-chip.gold .val { color: var(--neon-gold); text-shadow: 0 0 15px rgba(255, 215, 0, 0.6); }
    .stat-chip.green .val { color: var(--neon-green); text-shadow: 0 0 15px rgba(0, 255, 136, 0.6); }

    .stat-chip .lbl {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--text-dim);
      letter-spacing: 0.12em;
      margin-top: 0.3rem;
      display: block;
    }

    /* Section title */
    .section-title {
      font-family: var(--font-main);
      font-size: 0.9rem;
      color: var(--neon-violet);
      letter-spacing: 0.15em;
      margin-bottom: 1rem;
      padding-bottom: 0.6rem;
      border-bottom: 1px solid rgba(157, 0, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .msg-count-badge {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-dim);
    }

    /* Filter bar */
    .filter-bar {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .filter-bar input {
      background: var(--bg-card);
      border: 1px solid var(--border-neon);
      border-radius: 6px;
      padding: 0.55rem 1rem;
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 0.8rem;
      outline: none;
      flex: 1;
      min-width: 200px;
      transition: border-color 0.2s;
    }

    .filter-bar input:focus { border-color: var(--neon-blue); }
    .filter-bar input::placeholder { color: var(--text-dim); }

    .sort-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-neon);
      color: var(--text-dim);
      font-family: var(--font-mono);
      font-size: 0.7rem;
      padding: 0.55rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      letter-spacing: 0.08em;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .sort-btn.active, .sort-btn:hover {
      border-color: var(--neon-blue);
      color: var(--neon-blue);
    }

    /* Messages table */
    .messages-table-wrap {
      overflow-x: auto;
    }

    .msg-table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--font-body);
    }

    .msg-table thead th {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      color: var(--text-dim);
      padding: 0.7rem 1rem;
      text-align: left;
      border-bottom: 1px solid var(--border-neon);
      background: var(--bg-panel);
      white-space: nowrap;
    }

    .msg-table tbody tr {
      border-bottom: 1px solid rgba(0, 212, 255, 0.07);
      transition: background 0.15s;
    }

    .msg-table tbody tr:hover { background: rgba(0, 212, 255, 0.04); }

    .msg-table td {
      padding: 0.9rem 1rem;
      font-size: 0.9rem;
      vertical-align: top;
    }

    .td-id {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--text-dim);
      white-space: nowrap;
    }

    .td-name {
      font-weight: 700;
      color: var(--neon-blue);
      white-space: nowrap;
    }

    .td-msg {
      color: var(--text-primary);
      line-height: 1.4;
      word-break: break-word;
      max-width: 400px;
    }

    .td-time {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--text-dim);
      white-space: nowrap;
    }

    .td-actions { white-space: nowrap; }

    /* Empty / loading state */
    .empty-state {
      text-align: center;
      padding: 3rem;
      color: var(--text-dim);
      font-family: var(--font-mono);
      font-size: 0.85rem;
      letter-spacing: 0.1em;
    }

    /* Likes section */
    .likes-section {
      margin-top: 2.5rem;
    }

    .likes-hero {
      background: var(--bg-card);
      border: 1px solid rgba(255, 0, 110, 0.3);
      border-radius: 12px;
      padding: 2rem;
      text-align: center;
      box-shadow: 0 0 30px rgba(255, 0, 110, 0.08);
    }

    .likes-heart {
      font-size: 3rem;
      animation: heartbeat 1.5s ease-in-out infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    .likes-number {
      font-family: var(--font-main);
      font-size: clamp(3rem, 10vw, 5rem);
      font-weight: 900;
      color: var(--neon-pink);
      text-shadow: 0 0 30px rgba(255, 0, 110, 0.7);
      line-height: 1.1;
      display: block;
      margin: 0.5rem 0;
    }

    .likes-label {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--text-dim);
      letter-spacing: 0.15em;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: var(--bg-card2);
      border: 1px solid var(--neon-green);
      color: var(--neon-green);
      font-family: var(--font-mono);
      font-size: 0.8rem;
      padding: 0.8rem 1.4rem;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
      transform: translateY(80px);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 9999;
      pointer-events: none;
    }

    .toast.error { border-color: var(--neon-red); color: var(--neon-red); box-shadow: 0 0 20px rgba(255,51,85,0.2); }
    .toast.show { transform: translateY(0); opacity: 1; }

    /* Scan line overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0, 212, 255, 0.015) 3px,
        rgba(0, 212, 255, 0.015) 4px
      );
      pointer-events: none;
      z-index: 9998;
    }

    /* Confirm dialog */
    .confirm-overlay {
      position: fixed;
      inset: 0;
      background: rgba(3, 4, 10, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9000;
      backdrop-filter: blur(4px);
    }

    .confirm-box {
      background: var(--bg-card);
      border: 1px solid var(--neon-red);
      border-radius: 12px;
      padding: 2rem;
      width: min(380px, 90vw);
      text-align: center;
      box-shadow: 0 0 40px rgba(255, 51, 85, 0.2);
    }

    .confirm-box h3 {
      font-family: var(--font-main);
      font-size: 0.9rem;
      color: var(--neon-red);
      margin-bottom: 0.8rem;
      letter-spacing: 0.1em;
    }

    .confirm-box p {
      font-family: var(--font-body);
      color: var(--text-dim);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }

    .confirm-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
    }

    .btn-cancel {
      background: transparent;
      border: 1px solid var(--border-neon);
      color: var(--text-dim);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      padding: 0.6rem 1.4rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-cancel:hover { border-color: var(--neon-blue); color: var(--neon-blue); }

    .btn-confirm-del {
      background: var(--neon-red);
      border: none;
      color: #fff;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      padding: 0.6rem 1.4rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-confirm-del:hover { box-shadow: 0 0 16px rgba(255,51,85,0.5); }

    @media (max-width: 600px) {
      .admin-header { padding: 0.8rem 1rem; flex-wrap: wrap; gap: 0.5rem; }
      .admin-content { padding: 1.2rem 0.8rem 4rem; }
      .msg-table thead { display: none; }
      .msg-table tbody tr { display: block; border: 1px solid var(--border-neon); border-radius: 8px; margin-bottom: 1rem; padding: 0.5rem; }
      .msg-table td { display: block; padding: 0.4rem 0.6rem; }
      .td-id::before { content: 'ID: '; color: var(--text-dim); }
      .td-name::before { content: '👤 '; }
      .td-time::before { content: '🕐 '; }
    }
  </style>
</head>
<body>

<!-- ── LOGIN OVERLAY ── -->
<div id="login-overlay">
  <div class="login-box">
    <div class="login-logo">⚔️ VALENHART亗</div>
    <div class="login-sub">ADMIN ACCESS — RESTRICTED</div>
    <input type="password" id="admin-password" placeholder="MOT DE PASSE" autocomplete="off" />
    <div class="login-err" id="login-err"></div>
    <button class="neon-btn" id="login-btn">⚡ ACCÉDER AU PANEL</button>
  </div>
</div>

<!-- ── ADMIN PANEL ── -->
<div id="admin-panel">

  <header class="admin-header">
    <div class="header-left">
      <div class="admin-logo">⚔️ VALENHART亗</div>
      <span class="admin-badge">ADMIN</span>
    </div>
    <div class="header-right">
      <span class="last-refresh" id="last-refresh">—</span>
      <button class="refresh-btn" id="refresh-btn">↻ REFRESH</button>
      <button class="logout-btn" id="logout-btn">DÉCO</button>
    </div>
  </header>

  <div class="admin-content">

    <!-- Stats -->
    <div class="stats-bar">
      <div class="stat-chip">
        <span class="val" id="stat-total-msgs">—</span>
        <span class="lbl">TOTAL MESSAGES</span>
      </div>
      <div class="stat-chip pink">
        <span class="val" id="stat-total-likes">—</span>
        <span class="lbl">TOTAL LIKES</span>
      </div>
      <div class="stat-chip gold">
        <span class="val" id="stat-unique-names">—</span>
        <span class="lbl">EXPÉDITEURS UNIQUES</span>
      </div>
      <div class="stat-chip green">
        <span class="val" id="stat-last-msg">—</span>
        <span class="lbl">DERNIER MESSAGE</span>
      </div>
    </div>

    <!-- Messages section -->
    <div class="section-title">
      📨 MESSAGES REÇUS
      <span class="msg-count-badge" id="msg-count-badge">0 messages</span>
    </div>

    <div class="filter-bar">
      <input type="text" id="search-input" placeholder="🔍 Rechercher par nom ou message…" />
      <button class="sort-btn active" id="sort-new">↓ PLUS RÉCENT</button>
      <button class="sort-btn" id="sort-old">↑ PLUS ANCIEN</button>
    </div>

    <div class="messages-table-wrap">
      <table class="msg-table">
        <thead>
          <tr>
            <th>#</th>
            <th>EXPÉDITEUR</th>
            <th>MESSAGE</th>
            <th>DATE & HEURE</th>
            <th>ACTION</th>
          </tr>
        </thead>
        <tbody id="msg-tbody">
          <tr><td colspan="5" class="empty-state">Chargement…</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Likes section -->
    <div class="likes-section">
      <div class="section-title">❤️ COMPTEUR DE LIKES</div>
      <div class="likes-hero">
        <div class="likes-heart">❤️</div>
        <span class="likes-number" id="likes-big">0</span>
        <div class="likes-label">PERSONNES AIMENT SULTAN</div>
      </div>
    </div>

  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  // ── CONFIG ──
  const ADMIN_PASSWORD = 'Lucien345in'; // Change this!

  // ── STATE ──
  let allMessages = [];
  let totalLikes = 0;
  let sortOrder = 'new'; // 'new' | 'old'
  let searchQuery = '';

  // ── ELEMENTS ──
  const loginOverlay = document.getElementById('login-overlay');
  const adminPanel   = document.getElementById('admin-panel');
  const passwordInput = document.getElementById('admin-password');
  const loginErr     = document.getElementById('login-err');
  const tbody        = document.getElementById('msg-tbody');
  const toastEl      = document.getElementById('toast');

  // ── LOGIN ──
  function tryLogin() {
    if (passwordInput.value === ADMIN_PASSWORD) {
      loginOverlay.style.display = 'none';
      adminPanel.style.display = 'block';
      loadData();
    } else {
      loginErr.textContent = '⛔ MOT DE PASSE INCORRECT';
      passwordInput.value = '';
      passwordInput.focus();
      setTimeout(() => loginErr.textContent = '', 2500);
    }
  }

  document.getElementById('login-btn').addEventListener('click', tryLogin);
  passwordInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });

  document.getElementById('logout-btn').addEventListener('click', () => {
    adminPanel.style.display = 'none';
    loginOverlay.style.display = 'flex';
    passwordInput.value = '';
  });

  // ── LOAD DATA ──
  async function loadData() {
    try {
      const [msgsRes, statsRes] = await Promise.all([
        fetch('/api/messages'),
        fetch('/api/stats')
      ]);
      const msgsData  = await msgsRes.json();
      const statsData = await statsRes.json();

      allMessages = msgsData.messages || [];
      totalLikes  = statsData.likes || 0;

      updateStats();
      renderMessages();
      updateRefreshTime();
    } catch (err) {
      showToast('Erreur de chargement !', true);
    }
  }

  // ── STATS ──
  function updateStats() {
    document.getElementById('stat-total-msgs').textContent  = allMessages.length;
    document.getElementById('stat-total-likes').textContent = totalLikes;
    document.getElementById('likes-big').textContent        = totalLikes;

    const uniqueNames = new Set(allMessages.map(m => m.name.toLowerCase())).size;
    document.getElementById('stat-unique-names').textContent = uniqueNames;

    if (allMessages.length > 0) {
      // newest message timestamp
      const newest = allMessages.reduce((a, b) => a.id > b.id ? a : b);
      const d = new Date(newest.timestamp);
      document.getElementById('stat-last-msg').textContent =
        d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' });
    } else {
      document.getElementById('stat-last-msg').textContent = '—';
    }
  }

  // ── RENDER MESSAGES ──
  function renderMessages() {
    let list = [...allMessages];

    // Search filter
    if (searchQuery.trim()) {
      const q = searchQuery.toLowerCase();
      list = list.filter(m =>
        m.name.toLowerCase().includes(q) || m.text.toLowerCase().includes(q)
      );
    }

    // Sort
    list.sort((a, b) => sortOrder === 'new' ? b.id - a.id : a.id - b.id);

    document.getElementById('msg-count-badge').textContent =
      `${list.length} message${list.length !== 1 ? 's' : ''}`;

    if (list.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" class="empty-state">
        ${searchQuery ? '🔍 Aucun résultat pour "' + escHtml(searchQuery) + '"' : '📭 Aucun message pour l\'instant'}
      </td></tr>`;
      return;
    }

    tbody.innerHTML = list.map((msg, idx) => {
      const dt = new Date(msg.timestamp);
      const dateStr = dt.toLocaleDateString('fr-FR', {
        day: '2-digit', month: '2-digit', year: '2-digit'
      });
      const timeStr = dt.toLocaleTimeString('fr-FR', {
        hour: '2-digit', minute: '2-digit'
      });
      return `<tr>
        <td class="td-id">#${String(idx + 1).padStart(3, '0')}</td>
        <td class="td-name">${escHtml(msg.name)}</td>
        <td class="td-msg">${escHtml(msg.text)}</td>
        <td class="td-time">${dateStr}<br>${timeStr}</td>
        <td class="td-actions">
          <button class="neon-btn danger" onclick="confirmDelete(${msg.id}, '${escHtml(msg.name)}')">🗑 SUPPR</button>
        </td>
      </tr>`;
    }).join('');
  }

  // ── DELETE ──
  function confirmDelete(id, name) {
    const overlay = document.createElement('div');
    overlay.className = 'confirm-overlay';
    overlay.innerHTML = `
      <div class="confirm-box">
        <h3>⚠️ SUPPRESSION</h3>
        <p>Supprimer le message de <strong style="color:var(--neon-blue)">${escHtml(name)}</strong> ?<br>Cette action est irréversible.</p>
        <div class="confirm-actions">
          <button class="btn-cancel" id="cancel-del">ANNULER</button>
          <button class="btn-confirm-del" id="confirm-del">SUPPRIMER</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);

    document.getElementById('cancel-del').addEventListener('click', () => overlay.remove());
    document.getElementById('confirm-del').addEventListener('click', async () => {
      overlay.remove();
      await deleteMessage(id);
    });
  }

  async function deleteMessage(id) {
    try {
      const res = await fetch(`/api/messages/${id}`, { method: 'DELETE' });
      const data = await res.json();
      if (data.success) {
        allMessages = allMessages.filter(m => m.id !== id);
        updateStats();
        renderMessages();
        showToast('✅ Message supprimé');
      } else {
        showToast('Erreur lors de la suppression', true);
      }
    } catch {
      showToast('Erreur réseau', true);
    }
  }

  // ── SEARCH & SORT ──
  document.getElementById('search-input').addEventListener('input', e => {
    searchQuery = e.target.value;
    renderMessages();
  });

  document.getElementById('sort-new').addEventListener('click', () => {
    sortOrder = 'new';
    document.getElementById('sort-new').classList.add('active');
    document.getElementById('sort-old').classList.remove('active');
    renderMessages();
  });

  document.getElementById('sort-old').addEventListener('click', () => {
    sortOrder = 'old';
    document.getElementById('sort-old').classList.add('active');
    document.getElementById('sort-new').classList.remove('active');
    renderMessages();
  });

  // ── REFRESH ──
  document.getElementById('refresh-btn').addEventListener('click', loadData);

  function updateRefreshTime() {
    const now = new Date();
    document.getElementById('last-refresh').textContent =
      'Actualisé à ' + now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  // Auto-refresh every 30s
  setInterval(() => {
    if (adminPanel.style.display !== 'none') loadData();
  }, 30000);

  // ── TOAST ──
  let toastTimer;
  function showToast(msg, isError = false) {
    toastEl.textContent = msg;
    toastEl.className = 'toast' + (isError ? ' error' : '') + ' show';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 3000);
  }

  // ── UTILS ──
  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }
</script>
</body>
</html>
